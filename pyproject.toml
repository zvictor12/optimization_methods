[project]
name = "optimization-methods-labs"
version = "0.1.0"
description = "Laboratory work for optimization methods: one-dimensional and multidimensional minimization."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.10.0",
    "numpy>=2.2.0",
    "pandas>=2.2.0",
    "plotly>=6.0.0",
    "scipy>=1.15.0",
    "streamlit>=1.45.0",
    "sympy>=1.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"labs/lab*.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["."]
